<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Usuário | Avalia+</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/base.css">
  <script src="../js/acessibilidade.js"></script>
</head>
<body>
  <header id="cabecalho"></header>
  <div class="layout">
    <aside id="menu-lateral"></aside>
    <main class="principal" id="conteudo">
      <div class="cabecalho-formulario">
        <a class="voltar" id="link-voltar" href="adminusuarios.html">← Voltar para a lista</a>
      </div>
      <div class="titulo-pagina">
        <div>
          <h1><span id="titulo-acao">CADASTRAR</span> USUÁRIO</h1>
          <p id="subtitulo">Adicione um novo usuário à plataforma.</p>
        </div>
      </div>
      <p id="mensagem" hidden></p>
      <form id="formulario" class="form-caixa" novalidate>
        <p class="mensagem info" id="aviso-senha">A senha inicial é o CPF (somente números). No primeiro acesso, o sistema recomenda trocá-la.</p>
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" maxlength="150" required autocomplete="off">
        </div>
        <div class="linha-dupla">
          <div class="campo">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14" required placeholder="000.000.000-00" autocomplete="off">
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" maxlength="150" required placeholder="nome@instituicao.edu.br" autocomplete="off">
          </div>
        </div>
        <div class="linha-dupla">
          <div class="campo">
            <label for="idPerfil">Perfil</label>
            <select id="idPerfil" name="idPerfil" required>
              <option value="1">Aluno</option>
              <option value="2">Professor</option>
              <option value="3">Administrador</option>
            </select>
          </div>
          <div class="campo">
            <label for="dataIngresso">Data de ingresso</label>
            <input type="date" id="dataIngresso" name="dataIngresso" required>
          </div>
        </div>
        <div class="campo" id="campo-turma">
          <label for="idTurma">Turma</label>
          <select id="idTurma" name="idTurma"></select>
          <small class="ajuda">Somente contas de Aluno possuem turma (RN05).</small>
        </div>
        <div class="botoes">
          <a class="botao contorno" href="adminusuarios.html">Cancelar</a>
          <button type="submit" class="botao" id="botao-salvar">Criar Usuário</button>
        </div>
      </form>
    </main>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/sessao.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/cadastro.js"></script>
  <script src="../js/criarusuario.js"></script>
</body>
</html>
